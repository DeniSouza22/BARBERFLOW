<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro e Agendamento — BarberFlow</title>
  <link rel="stylesheet" href="CSS/global.css">
  <style>
    .form-container { max-width: 600px; margin: 0 auto; }
    .form-grupo { margin-bottom: 1.2rem; }
  </style>
</head>
<body>

  <header>
    <h1>✂ BarberFlow</h1>
    <nav>
      <ul>
        <li><a href="index.html">🏠 Início</a></li>
        <li><a href="cadastro.html" class="ativo" id="nav-titulo">📝 Cadastro</a></li>
        <li><a href="login.html" id="nav-link-auth">🚪 Entrar</a></li>
      </ul>
    </nav>
  </header>

  <main class="form-container">
    <div id="msg-cadastro" class="alerta" style="display:none"></div>

    <section id="secao-registro-cliente">
      <h2>📝 Cadastro de Cliente</h2>
      <p>Crie sua conta em segundos para gerenciar seus agendamentos premium.</p>
      
      <form id="form-registro-cliente">
        <fieldset>
          <legend>Informações de Acesso</legend>
          <div class="form-grupo">
            <label for="c-nome">Nome Completo *</label>
            <input type="text" id="c-nome" required placeholder="Ex: João da Silva">
          </div>
          <div class="form-grupo">
            <label for="c-email">E-mail *</label>
            <input type="email" id="c-email" required placeholder="joao@email.com">
          </div>
          <div class="form-grupo">
            <label for="c-senha">Senha (Mínimo 6 caracteres) *</label>
            <input type="password" id="c-senha" required minlength="6" placeholder="******">
          </div>
        </fieldset>

        <fieldset>
          <legend>Dados de Contato e Identificação</legend>
          <div class="form-grupo">
            <label for="c-telefone">Telefone / WhatsApp</label>
            <input type="tel" id="c-telefone" placeholder="(81) 9 9999-0000">
          </div>
          <div class="form-grupo">
            <label for="c-cpf">CPF</label>
            <input type="text" id="c-cpf" placeholder="000.000.000-00" maxlength="14">
          </div>
          <div class="form-grupo">
            <label for="c-nascimento">Data de Nascimento</label>
            <input type="date" id="c-nascimento">
          </div>
        </fieldset>

        <button type="submit" class="btn">Finalizar Cadastro</button>
      </form>
    </section>

    <section id="secao-novo-agendamento" style="display:none;">
      <h2>📅 Novo Agendamento</h2>
      <p>Escolha o serviço e o horário ideal.</p>

      <form id="form-novo-agendamento">
        <fieldset>
          <legend>Detalhes do Atendimento</legend>
          <div class="form-grupo">
            <label for="a-servico">Serviço *</label>
            <select id="a-servico" required>
              <option value="">Selecione um serviço...</option>
              <option value="Corte Social">Corte Social — R$ 40,00</option>
              <option value="Corte + Barba">Corte + Barba — R$ 70,00</option>
              <option value="Barba Premium">Barba Terapia — R$ 35,00</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="a-barbeiro">Barbeiro *</label>
            <select id="a-barbeiro" required>
              <option value="">Selecione o profissional...</option>
              <option value="Marco Barbeiro">Marco Barbeiro</option>
              <option value="Lucas Oliveira">Lucas Oliveira</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="a-data">Data desejada *</label>
            <input type="date" id="a-data" required min="2026-06-09">
          </div>

          <div class="form-grupo">
            <label for="a-horario">Horário *</label>
            <select id="a-horario" required>
              <option value="">Selecione o horário...</option>
              <option value="09:00">09:00</option>
              <option value="10:00">10:00</option>
              <option value="14:00">14:00</option>
              <option value="16:00">16:00</option>
              <option value="18:00">18:00</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="a-pagamento">Forma de Pagamento *</label>
            <select id="a-pagamento" required>
              <option value="pix">PIX</option>
              <option value="dinheiro">Dinheiro</option>
              <option value="credito">Cartão de Crédito</option>
            </select>
          </div>

          <div class="form-grupo">
            <label for="a-obs">Observações Especiais</label>
            <textarea id="a-obs" placeholder="Alguma restrição ou preferência para este dia?" rows="3"></textarea>
          </div>
        </fieldset>

        <button type="submit" class="btn">Confirmar Agendamento</button>
        <a href="area-cliente.html" class="btn btn-outline" style="margin-left: 1rem;">Voltar</a>
      </form>
    </section>
  </main>

  <script src="JS/db.js"></script>
  <script>
    const sessao = DB.usuarioLogado();
    const msg = document.getElementById("msg-cadastro");

    // Controle de fluxo visual baseado em autenticação
    if (sessao) {
      document.getElementById("secao-registro-cliente").style.display = "none";
      document.getElementById("secao-novo-agendamento").style.display = "block";
      document.getElementById("nav-titulo").textContent = "📅 Agendar";
      document.getElementById("nav-titulo").href = "cadastro.html";
      
      const authLink = document.getElementById("nav-link-auth");
      authLink.textContent = "👤 Minha Área";
      authLink.href = "area-cliente.html";
    }

    // Ação: Cadastro de Cliente
    document.getElementById("form-registro-cliente").addEventListener("submit", function(e) {
      e.preventDefault();
      msg.style.display = "none";

      const dados = {
        nome: document.getElementById("c-nome").value.trim(),
        email: document.getElementById("c-email").value.trim(),
        senha: document.getElementById("c-senha").value,
        telefone: document.getElementById("c-telefone").value.trim(),
        cpf: document.getElementById("c-cpf").value.trim(),
        nascimento: document.getElementById("c-nascimento").value
      };

      const res = DB.criarUsuario(dados);

      if (res.ok) {
        msg.className = "alerta alerta-ok";
        msg.textContent = "Cadastro realizado com sucesso! Redirecionando para o login...";
        msg.style.display = "block";
        setTimeout(() => { window.location.href = "login.html"; }, 2000);
      } else {
        msg.className = "alerta alerta-erro";
        msg.textContent = res.msg;
        msg.style.display = "block";
      }
    });

    // Ação: Criar Novo Agendamento
    document.getElementById("form-novo-agendamento").addEventListener("submit", function(e) {
      e.preventDefault();
      msg.style.display = "none";

      const dadosAgendamento = {
        usuarioId: sessao.id,
        servico: document.getElementById("a-servico").value,
        barbeiro: document.getElementById("a-barbeiro").value,
        data: document.getElementById("a-data").value,
        horario: document.getElementById("a-horario").value,
        pagamento: document.getElementById("a-pagamento").value,
        observacoes: document.getElementById("a-obs").value.trim()
      };

      DB.criarAgendamento(dadosAgendamento);

      msg.className = "alerta alerta-ok";
      msg.textContent = "Agendamento confirmado com sucesso!";
      msg.style.display = "block";

      setTimeout(() => { window.location.href = "area-cliente.html"; }, 1500);
    });
  </script>
</body>
</html>
