<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar Conta — BarberFlow</title>
  <link rel="stylesheet" href="CSS/global.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }
    .caixa {
      background: var(--carvao);
      border: 1px solid #333;
      border-top: 3px solid var(--ouro);
      border-radius: 8px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 480px;
      box-shadow: var(--sombra);
    }
    .caixa h2 { margin-bottom: .4rem; font-size: 1.6rem; }
    .caixa > p { margin-bottom: 1.5rem; }
    .campo { margin-bottom: 1.1rem; }
    .campo label { margin-bottom: .35rem; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .rodape { margin-top: 1.2rem; text-align: center; font-size: .85rem; color: var(--cinza-txt); }
  </style>
</head>
<body>

  <header>
    <h1>✂ BarberFlow</h1>
    <nav>
      <ul>
        <li><a href="index.html">🏠 Início</a></li>
        <li><a href="servicos.html">✂ Serviços</a></li>
        <li><a href="barbeiros.html">👤 Barbeiros</a></li>
        <li><a href="login.html">🔐 Login</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <div class="caixa">
      <h2>📋 Criar conta</h2>
      <p>Cadastre-se para agendar e acompanhar seus atendimentos.</p>

      <div id="msg-erro" class="alerta alerta-erro" style="display:none"></div>
      <div id="msg-ok"   class="alerta alerta-ok"   style="display:none"></div>

      <form id="form-registro" novalidate>
        <div class="campo">
          <label for="nome">Nome completo *</label>
          <input type="text" id="nome" name="nome"
                 placeholder="Ex.: João da Silva" required maxlength="100">
        </div>

        <div class="campo">
          <label for="email">E-mail *</label>
          <input type="email" id="email" name="email"
                 placeholder="seu@email.com" required>
        </div>

        <div class="grid-2">
          <div class="campo">
            <label for="senha">Senha *</label>
            <input type="password" id="senha" name="senha"
                   placeholder="Mínimo 6 caracteres" required minlength="6">
          </div>
          <div class="campo">
            <label for="confirma">Confirmar senha *</label>
            <input type="password" id="confirma" name="confirma"
                   placeholder="Repita a senha" required>
          </div>
        </div>

        <div class="campo">
          <label for="telefone">Telefone / WhatsApp *</label>
          <input type="tel" id="telefone" name="telefone"
                 placeholder="(81) 9 9999-9999" required>
        </div>

        <div class="grid-2">
          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf"
                   placeholder="000.000.000-00" maxlength="14">
          </div>
          <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento"
                   min="1920-01-01" max="2015-12-31">
          </div>
        </div>

        <input type="submit" value="Criar minha conta" style="width:100%;margin-top:.4rem">
      </form>

      <div class="rodape">
        Já tem conta? <a href="login.html">Entrar →</a>
      </div>
    </div>
  </main>

  <footer>
    <p><strong>BarberFlow</strong><br>
    &copy; 2026 Barbearia · Recife, PE · Todos os direitos reservados</p>
    <nav><ul>
      <li><a href="index.html">Início</a></li>
      <li><a href="servicos.html">Serviços</a></li>
      <li><a href="barbeiros.html">Barbeiros</a></li>
      <li><a href="login.html">Login</a></li>
    </ul></nav>
  </footer>

  <script src="JS/db.js"></script>
  <script>
    if (DB.usuarioLogado()) window.location.href = "area-cliente.html";

    document.getElementById("form-registro").addEventListener("submit", function(e) {
      e.preventDefault();
      const msgErro = document.getElementById("msg-erro");
      const msgOk   = document.getElementById("msg-ok");
      msgErro.style.display = msgOk.style.display = "none";

      const nome      = document.getElementById("nome").value.trim();
      const email     = document.getElementById("email").value.trim();
      const senha     = document.getElementById("senha").value;
      const confirma  = document.getElementById("confirma").value;
      const telefone  = document.getElementById("telefone").value.trim();
      const cpf       = document.getElementById("cpf").value.trim();
      const nascimento= document.getElementById("nascimento").value;

      if (senha !== confirma) {
        msgErro.textContent = "As senhas não coincidem.";
        msgErro.style.display = "block";
        return;
      }
      if (senha.length < 6) {
        msgErro.textContent = "A senha deve ter pelo menos 6 caracteres.";
        msgErro.style.display = "block";
        return;
      }

      const resultado = DB.criarUsuario({ nome, email, senha, telefone, cpf, nascimento });
      if (!resultado.ok) {
        msgErro.textContent = resultado.msg;
        msgErro.style.display = "block";
        return;
      }

      DB.login(email, senha);
      msgOk.textContent = "Conta criada com sucesso! Redirecionando…";
      msgOk.style.display = "block";
      setTimeout(() => { window.location.href = "area-cliente.html"; }, 1400);
    });
  </script>

</body>
</html>
